<!DOCTYPE html>
<html>
<head>
<title>Student Performance Predictor</title>

<style>
body{
font-family:Arial;
background:linear-gradient(135deg,#667eea,#764ba2);
text-align:center;
margin:0;
padding:0;
}

.container{
width:420px;
margin:40px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

input{
width:90%;
padding:12px;
margin:10px;
border-radius:10px;
border:1px solid #ccc;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#4CAF50;
color:white;
cursor:pointer;
font-size:16px;
}

.dashboard-btn{
background:#2196F3;
text-decoration:none;
padding:12px 20px;
color:white;
border-radius:10px;
display:inline-block;
margin-top:15px;
}

.result{
background:#f8f9fa;
padding:15px;
border-radius:12px;
margin-top:20px;
}

progress{
width:100%;
height:25px;
}
</style>

</head>
<body>

<div class="container">

<h1>Student Performance Predictor</h1>

<form action="/predict" method="POST">

<input type="text" name="name" placeholder="Student Name" required>
<input type="number" name="hours" placeholder="Study Hours" required>
<input type="number" name="attendance" placeholder="Attendance %" required>
<input type="number" name="sleep" placeholder="Sleep Hours" required>
<input type="number" name="midsem" placeholder="Mid-Sem Marks /20" required>

<button type="submit">Predict Performance</button>

</form>

<a href="/dashboard" class="dashboard-btn">
Analyze Student Data →
</a>

{% if prediction_text %}
<div class="result">
<h2>Predicted Marks: {{ prediction_text }}</h2>
<h3>Grade: {{ grade }}</h3>
<h3>{{ status }}</h3>
<p>{{ advice }}</p>
<progress value="{{ progress }}" max="100"></progress>
<p>{{ progress }}%</p>
</div>
{% endif %}

</div>

</body>
</html>
